<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>掌中劍・月下決 Swords in the Palm</title>
  <meta name="description" content="台灣布袋戲風格的 3D 動畫短片：月夜竹林與雲海山巔，白髮劍客對決血蓮魔尊，五分鐘的劇情與打鬥，口白、出場詩、鑼鼓與配音。">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E🎎%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=15">
</head>
<body>
  <div id="frame">
    <canvas id="gl"></canvas>
    <div id="vignette"></div>
    <div id="flash"></div>
    <div id="title"></div>
    <div id="end"></div>
    <div id="card"></div>
    <div id="sub"></div>
    <div id="fade"></div>
    <div id="start">
      <div id="st"></div>
      <p id="blurb"></p>
      <nav id="eps"></nav>
      <p id="loading">載入中… Loading…</p>
      <button id="go" hidden>▶</button>
      <p id="hint"></p>
    </div>
  </div>
  <nav id="epmenu" hidden></nav>
  <div id="bar">
    <button id="pp" aria-label="play / pause">▶</button>
    <input id="scrub" type="range" min="0" max="30" step="0.01" value="0" aria-label="time">
    <span id="time">00.0 / 30.0</span>
    <button id="epbtn" aria-label="episodes">☰</button>
    <button id="lang">EN</button>
    <button id="mute" aria-label="sound">🔊</button>
    <button id="fs" aria-label="full screen">⛶</button>
  </div>
  <script src="/hub.js" defer data-pos="top-right"></script>
  <script type="module" src="js/film.js?v=16"></script>
</body>
</html>
